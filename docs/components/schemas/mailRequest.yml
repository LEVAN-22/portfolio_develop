type: object
required:
  - id
  - name
  - dateTime
  - event
  - country
  - email
properties:
  id:
    type: integer
    example: 123
  name:
    type: string
    example: "John Doe"
  dateTime:
    type: string
    format: date-time
    example: "2025-10-15T14:00:00+09:00"
  event:
    type: string
    enum: ["UESHIMA MUSEUM", "UESHIMA MUSEUM ANNEX"]
    example: "UESHIMA MUSEUM"
  country:
    type: string
    example: "JP"
  coupon:
    type: string
    nullable: true
    example: "MEMBER2025"
  email:
    type: string
    format: email
    example: "john@example.com"
